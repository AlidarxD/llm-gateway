[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible API gateway between apps and LLM providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Opt-in semantic cache (multilingual-e5-small via ONNX on CPU)
semantic = ["onnxruntime>=1.18", "tokenizers>=0.20", "huggingface-hub>=0.24"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "locust>=2.31",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Optional "semantic" extra: not installed in CI.
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gateway.middleware.cache.embedder"]
warn_unused_ignores = false
